<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay output</title>
<link rel="stylesheet" href="replay.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: fixed; inset: 16px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="replay.js"></script>
<script>
  // Audience output: renders only the published scene from /api/events. No controls.
  const view = new Replay.PublishedView(document.getElementById('stage'));
  Replay.subscribe((msg) => view.update(msg), (hb) => view.clock(hb.serverNowMs));
</script>
</body>
</html>
